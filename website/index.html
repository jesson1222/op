<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站 - OpenClaw 部署</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .deployed-by {
            margin-top: 50px;
            font-size: 0.9em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 欢迎来到我的网站</h1>
        <p class="subtitle">由 OpenClaw AI 助手自动部署到 GitHub Pages</p>
        
        <div class="features">
            <div class="feature">
                <h3>🤖 AI 助手</h3>
                <p>OpenClaw 提供智能自动化</p>
            </div>
            <div class="feature">
                <h3>⚡ 快速部署</h3>
                <p>一键发布到 GitHub Pages</p>
            </div>
            <div class="feature">
                <h3>🌍 全球访问</h3>
                <p>免费 CDN 加速</p>
            </div>
        </div>
        
        <p class="deployed-by">部署时间: 2026-02-28 | 由 OpenClaw 自动部署</p>
    </div>
</body>
</html>
