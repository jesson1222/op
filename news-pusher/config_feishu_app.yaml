# 飞书企业应用配置

# ============ 飞书开放平台配置 ============

# 应用凭证（从飞书开放平台获取）
feishu_app:
  app_id: "cli_a91b830db038dcef"        # ✅ 已配置
  app_secret: "CmDyBFAR1PzFGWjtQf36NeVrlnLnGqCa"      # ✅ 已配置
  chat_id: "oc_5c168da770548db5e961d35e5eef8e80"           # ✅ 已配置

# ============ 推送配置 ============

schedule:
  timezone: "Asia/Shanghai"
  times: ["09:00"]  # 每天推送时间
  max_items_per_push: 10  # 每次最多几条新闻

# ============ RSS 源配置 ============

feeds:
  ai:
    path: feeds/ai.yaml
    enabled: true
    title: "🤖 AI 科技"
    emoji: "🤖"
  
  camera:
    path: feeds/camera.yaml
    enabled: true
    title: "🎬 影视器材"
    emoji: "🎬"
  
  photography:
    path: feeds/photography.yaml
    enabled: true
    title: "📷 摄影"
    emoji: "📷"

# ============ 内容过滤 ============

filter:
  exclude_keywords: ["广告", "推广", "赞助"]
  min_title_length: 5

# ============ 翻译配置 ============

# 百度翻译 API（推荐，国内可访问）
# 申请地址：https://fanyi-api.baidu.com/
# 免费额度：QPS=1，每月 200 万字符
translate:
  # 设置为 true 启用翻译，false 跳过翻译
  enabled: true
  # 百度翻译 APP ID（需自行申请）
  baidu_app_id: "20260310002569431"
  # 百度翻译 APP KEY（需自行申请）
  baidu_app_key: "4BYpyDUBHCnF1OOJLp9v"

# 跳过翻译（兼容旧配置，优先使用 translate.enabled）
# 设置为 true 时，直接推送英文原文
skip_translation: false

# ============ 日志配置 ============

logging:
  level: "INFO"
  file: "pusher.log"
  history_file: "history.json"
