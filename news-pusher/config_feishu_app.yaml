# ============ 推送配置 ============

schedule:
  timezone: "Asia/Shanghai"
  times: ["09:00"]  # 每天推送时间
  max_items_per_push: 10  # 每次最多几条新闻

# ============ RSS 源配置 ============

feeds:
  ai:
    path: feeds/ai.yaml
    enabled: true
    title: "🤖 AI 科技"
    emoji: "🤖"
  
  camera:
    path: feeds/camera.yaml
    enabled: true
    title: "🎬 影视器材"
    emoji: "🎬"
  
  photography:
    path: feeds/photography.yaml
    enabled: true
    title: "📷 摄影"
    emoji: "📷"

# ============ 内容过滤 ============

filter:
  exclude_keywords: ["广告", "推广", "赞助"]
  min_title_length: 5

# ============ 日志配置 ============

logging:
  level: "INFO"
  file: "logs/pusher.log"
  history_file: "logs/history.json"
