<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Search Engine - 多引擎搜索引擎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .search-box {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: #667eea;
        }
        
        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
        }
        
        .search-btn:active {
            transform: translateY(0);
        }
        
        .engine-selector {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .engine-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        .engine-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .results-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .results-count {
            color: #666;
            font-size: 14px;
        }
        
        .result-item {
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        
        .result-item:hover {
            transform: translateX(5px);
        }
        
        .result-title {
            font-size: 18px;
            color: #1a73e8;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }
        
        .result-title:hover {
            text-decoration: underline;
        }
        
        .result-url {
            color: #006621;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .result-snippet {
            color: #545454;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .result-meta {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: #999;
        }
        
        .meta-tag {
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .meta-tag.google { background: #4285f4; color: white; }
        .meta-tag.bing { background: #00897b; color: white; }
        .meta-tag.duckduckgo { background: #de5833; color: white; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Multi Search Engine</h1>
            <p>多引擎融合搜索 · 更全面的搜索结果</p>
        </div>
        
        <div class="search-box">
            <div class="search-input-group">
                <input type="text" class="search-input" id="searchInput" 
                       placeholder="输入搜索关键词..." 
                       onkeypress="if(event.keyCode===13) performSearch()">
                <button class="search-btn" onclick="performSearch()">搜索</button>
            </div>
            
            <div class="engine-selector">
                <label class="engine-checkbox">
                    <input type="checkbox" id="engineGoogle" checked>
                    <span>🔵 Google</span>
                </label>
                <label class="engine-checkbox">
                    <input type="checkbox" id="engineBing" checked>
                    <span>🟢 Bing</span>
                </label>
                <label class="engine-checkbox">
                    <input type="checkbox" id="engineDuckDuckGo" checked>
                    <span>🟠 DuckDuckGo</span>
                </label>
                <label class="engine-checkbox">
                    <input type="checkbox" id="engineBaidu">
                    <span>🔴 百度</span>
                </label>
            </div>
        </div>
        
        <div class="stats" style="display: none;" id="statsContainer">
            <div class="stat-card">
                <div class="stat-value" id="statResults">0</div>
                <div class="stat-label">融合结果</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statEngines">0</div>
                <div class="stat-label">查询引擎</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statTime">0ms</div>
                <div class="stat-label">响应时间</div>
            </div>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <h3>开始搜索</h3>
                <p>输入关键词，按回车或点击搜索按钮</p>
            </div>
        </div>
    </div>
    
    <script>
        let searchResults = [];
        
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('请输入搜索关键词！');
                return;
            }
            
            // 获取选中的引擎
            const engines = [];
            if (document.getElementById('engineGoogle').checked) engines.push('google');
            if (document.getElementById('engineBing').checked) engines.push('bing');
            if (document.getElementById('engineDuckDuckGo').checked) engines.push('duckduckgo');
            if (document.getElementById('engineBaidu').checked) engines.push('baidu');
            
            if (engines.length === 0) {
                alert('请至少选择一个搜索引擎！');
                return;
            }
            
            // 显示加载状态
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在搜索 ${engines.length} 个引擎...</p>
                </div>
            `;
            
            const startTime = Date.now();
            
            try {
                // 模拟搜索结果（实际使用时替换为真实 API 调用）
                const results = await mockSearch(query, engines);
                
                // 融合结果（RRF 算法）
                const fusedResults = reciprocalRankFusion(results);
                
                // 去重
                const dedupedResults = deduplicate(fusedResults);
                
                const endTime = Date.now();
                const duration = endTime - startTime;
                
                // 更新统计
                updateStats(dedupedResults.length, engines.length, duration);
                
                // 显示结果
                displayResults(dedupedResults);
                
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h3>搜索失败</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function mockSearch(query, engines) {
            // 模拟 API 延迟
            await new Promise(resolve => setTimeout(resolve, 500 + Math.random() * 500));
            
            const results = {};
            
            engines.forEach(engine => {
                results[engine] = Array.from({length: 10}, (_, i) => ({
                    url: `https://${engine}-result-${i+1}.com`,
                    title: `${engine} 结果 ${i+1}: ${query}`,
                    snippet: `这是来自 ${engine} 的第 ${i+1} 条搜索结果，与"${query}"相关...`,
                    rank: i + 1,
                    engine: engine
                }));
            });
            
            return results;
        }
        
        function reciprocalRankFusion(results, k = 60) {
            const scores = {};
            
            Object.keys(results).forEach(engine => {
                results[engine].forEach((result, index) => {
                    const key = result.url;
                    if (!scores[key]) {
                        scores[key] = {
                            ...result,
                            score: 0,
                            engines: []
                        };
                    }
                    const rrfScore = 1.0 / (k + index + 1);
                    scores[key].score += rrfScore;
                    scores[key].engines.push(engine);
                });
            });
            
            return Object.values(scores).sort((a, b) => b.score - a.score);
        }
        
        function deduplicate(results) {
            const seen = new Set();
            return results.filter(result => {
                const domain = new URL(result.url).hostname;
                if (seen.has(domain)) return false;
                seen.add(domain);
                return true;
            });
        }
        
        function updateStats(resultsCount, enginesCount, time) {
            document.getElementById('statsContainer').style.display = 'grid';
            document.getElementById('statResults').textContent = resultsCount;
            document.getElementById('statEngines').textContent = enginesCount;
            document.getElementById('statTime').textContent = time + 'ms';
        }
        
        function displayResults(results) {
            const container = document.getElementById('resultsContainer');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>没有找到结果</h3>
                        <p>尝试其他关键词或更换搜索引擎</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <div class="results-header">
                    <h3>搜索结果 (${results.length} 条)</h3>
                    <div class="results-count">使用 RRF 算法融合</div>
                </div>
            `;
            
            results.forEach((result, index) => {
                const engineTags = result.engines.map(e => 
                    `<span class="meta-tag ${e}">${e}</span>`
                ).join('');
                
                html += `
                    <div class="result-item">
                        <a href="${result.url}" class="result-title" target="_blank">
                            ${index + 1}. ${result.title}
                        </a>
                        <div class="result-url">${result.url}</div>
                        <div class="result-snippet">${result.snippet}</div>
                        <div class="result-meta">
                            ${engineTags}
                            <span class="meta-tag">RRF 分数：${result.score.toFixed(4)}</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
    </script>
</body>
</html>
